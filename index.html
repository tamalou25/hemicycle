<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hémicycle</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M2 28a14 14 0 0 1 28 0z%22 fill=%22%231e3a6e%22/%3E%3C/svg%3E">
<meta name="description" content="Hémicycle : simulation politique de la France, tour par tour.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { creme: '#FAF6EC', carte: '#FFFDF7', encre: '#14213D', bord: '#D9D2BF', doux: '#4A5568', bleu: '#1F3A6E', rouge: '#B3262B' },
  fontFamily: { serif: ['"Source Serif 4"', 'Georgia', 'serif'] }
} } };
</script>
<style>
  body { background: #FAF6EC; color: #14213D; }
  :focus-visible { outline: 3px solid #1F3A6E; outline-offset: 2px; border-radius: 4px; }
  .tricolore { height: 4px; background: linear-gradient(90deg, #1F3A6E 0 33.3%, #fff 33.3% 66.6%, #B3262B 66.6%); border-bottom: 1px solid #D9D2BF; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px; border-radius: 6px; font-weight: 600; border: 1px solid #14213D; }
  .btn-p { background: #14213D; color: #fff; }
  .btn-p:hover:not(:disabled) { background: #1F3A6E; }
  .btn-s { background: #FFFDF7; color: #14213D; }
  .btn-s:hover:not(:disabled) { background: #EFE9D6; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .champ { width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid #6B7280; border-radius: 6px; background: #fff; }
  input[type=range] { width: 100%; accent-color: #1F3A6E; min-height: 28px; }
</style>
</head>
<body class="min-h-screen flex flex-col font-sans">
<a href="#app" class="sr-only focus:not-sr-only focus:absolute focus:p-2 focus:bg-white">Aller au contenu</a>
<div class="tricolore" aria-hidden="true"></div>
<main id="app" class="flex-1 w-full max-w-5xl mx-auto px-4 py-4" tabindex="-1"></main>
<div id="toasts" role="alert" aria-live="assertive" aria-atomic="true" class="fixed bottom-4 left-4 right-4 sm:left-auto sm:max-w-md z-50"></div>
<footer class="border-t border-bord mt-8 px-4 py-4 text-sm text-doux">
  <div class="max-w-5xl mx-auto">
    <p>Simulation fictive. Les événements simulés ne reflètent pas les actions ou propos réels des personnes citées.</p>
    <p class="mt-1"><a class="underline text-bleu" href="https://github.com/tamalou25/hemicycle/blob/main/docs/SOURCES.md" target="_blank" rel="noopener">Sources des données</a></p>
  </div>
</footer>
<script type="module" src="./src/main.js"></script>
</body>
</html>
